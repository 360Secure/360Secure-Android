name: Build 360Secure Premium Android APK

on:
  push:
    branches:
      - feature/android-premium-doorbell-v1
      - feature/visitor-alerts-deep-links
      - 360secure-integrated
      - main
  pull_request:
    branches: [main, 360secure-integrated]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    name: Compile Android and upload APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify JavaScript
        run: node --check app/src/main/assets/app.js
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Configure stable release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/360secure-release.jks"
            chmod 600 "$RUNNER_TEMP/360secure-release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/360secure-release.jks" >> "$GITHUB_ENV"
            echo "SIGN_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "SIGN_RELEASE=false" >> "$GITHUB_ENV"
            echo "Stable release signing not configured; creating test APK only."
          fi
      - name: Build signed release APK (if configured)
        if: env.SIGN_RELEASE == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Upload stable signed release APK
        if: env.SIGN_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 360Secure-Signed-Update-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/360secure-release.jks"
      - name: Upload installable debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 360Secure-Premium-Android-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
