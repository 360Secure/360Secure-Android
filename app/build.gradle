plugins { id 'com.android.application' }

android {
    namespace 'in.secure360.app'
    compileSdk 35
    defaultConfig {
        applicationId 'in.secure360.app'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0-preview'
    }
    // Once configured in GitHub Actions, a stable private keystore signs every future release.
    signingConfigs {
        stableRelease {
            def filePath = System.getenv('ANDROID_KEYSTORE_FILE')
            if (filePath) {
                storeFile file(filePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_FILE')) signingConfig signingConfigs.stableRelease
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] } }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation platform('com.google.firebase:firebase-bom:33.9.0')
    implementation 'com.google.firebase:firebase-messaging'
}
