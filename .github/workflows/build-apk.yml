name: Build 360Secure Premium Android APK

on:
  push:
    branches:
      - feature/android-premium-doorbell-v1
      - 360secure-integrated
      - main
  pull_request:
    branches: [main, 360secure-integrated]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    name: Compile Android and upload APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify JavaScript
        run: node --check app/src/main/assets/app.js
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload installable debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 360Secure-Premium-Android-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
